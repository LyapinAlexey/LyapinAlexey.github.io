name: Bug report
description: Report a problem with the portfolio website
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the portfolio. Do not include passwords, tokens, or other private information.
  - type: textarea
    id: description
    attributes:
      label: Describe the problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the page or section and the actions that reveal the problem.
      placeholder: |
        1. Open ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      description: Include browser version, device, and viewport size if relevant.
      placeholder: e.g. Safari on iPhone, Chrome on macOS
  - type: textarea
    id: context
    attributes:
      label: Screenshots or additional context
      description: Add screenshots or relevant browser console errors, if available.
